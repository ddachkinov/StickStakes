<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0e1116" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>StickStakes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <!-- Roster: who's in, how many lives, how many rounds they've taken. -->
    <ul id="roster"></ul>

    <!-- Top band: round label and the host's match controls. -->
    <div id="banner" hidden>
      <span id="banner-round"></span>
      <span id="banner-note"></span>
      <button id="banner-action" type="button" hidden></button>
    </div>

    <!-- Centred beat: "3 · 2 · 1 · FIGHT", the round result, the final call. -->
    <div id="bigtext" hidden>
      <div id="bigtext-main"></div>
      <div id="bigtext-sub"></div>
    </div>

    <div id="hud"><span id="status">connecting…</span></div>
    <button id="fullscreen" type="button" aria-label="Fullscreen">⛶</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
